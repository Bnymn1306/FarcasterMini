    <!-- Base Build Verification -->
    <meta name="base:app_id" content="692acd2f6483df195b74bac2" />

    <!-- Farcaster Mini App Embed Meta Tag -->
    <meta name="fc:frame" content='{"version":"1","imageUrl":"https://basedmem.xyz/icon.jpg","button":{"title":"Trade Now","action":{"type":"launch_miniapp","name":"BasedMem","url":"https://basedmem.xyz","splashImageUrl":"https://basedmem.xyz/splash-icon.jpg","splashBackgroundColor":"#0A0A0A"}}}' />
    
    <!-- ✅ CRITICAL CACHE BUST - Force Warpcast to reload! -->
    <meta name="app-version" content="20251130T150000" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <!-- ✅ CRITICAL FRAME DETECTION - Cache before Warpcast strips UA! -->
    <script>
      (function() {
        // ✅ IMPROVED: Frame detection via multiple signals
        var ua = navigator.userAgent || '';
        var uaLower = ua.toLowerCase();
        
        // Check 1: Direct Warpcast/Farcaster UA (may not always be present)
        var isFrameUA = uaLower.includes('warpcast') || 
                        uaLower.includes('farcaster');
        
        // Check 2: Mobile WebView indicators (Android/iOS in-app browser)
        var isMobileWebView = (uaLower.includes(' wv)') || // Android WebView
                               uaLower.includes('mobile') && !uaLower.includes('safari/')) ||
                               uaLower.includes('fban') || // Facebook in-app
                               uaLower.includes('fbav'); 
        
        // Check 3: In iframe (but not Replit preview)
        var isIframe = window.self !== window.top;
        var isReplitPreview = document.referrer.includes('replit.dev') && 
                              document.referrer.includes('workspace_iframe');
        
        // Check 4: PC Farcaster (iframe on warpcast.com domain)
        var isPCFarcaster = isIframe && !isReplitPreview && 
                            (document.referrer.includes('warpcast.com') || 
                             document.referrer.includes('farcaster.xyz') ||
                             window.location.hostname === 'basedmem.xyz');
        
        // ✅ Frame = direct UA match OR (mobile webview in iframe) OR (PC Farcaster)
        var isFrame = isFrameUA || (isMobileWebView && isIframe && !isReplitPreview) || isPCFarcaster;
        
        // ✅ Cache detection result
        window.__FRAME_ENV = isFrame;
        window.__IS_PC_FARCASTER = isPCFarcaster;
        window.__FRAME_UA = ua;
        window.__FRAME_DETECTION = {
          isFrameUA: isFrameUA,
          isMobileWebView: isMobileWebView,
          isPCFarcaster: isPCFarcaster,
          isIframe: isIframe,
          isReplitPreview: isReplitPreview,
          final: isFrame
        };
        
        console.log('🔍 Boot-time Frame detection:', window.__FRAME_DETECTION);
        
        // Set visible title
        document.title = 'BasedMem';
        
        // Send telemetry
        fetch('/api/frame-telemetry', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            isFrame: isFrame,
            detection: window.__FRAME_DETECTION,
            userAgent: ua,
            referrer: document.referrer,
            timestamp: new Date().toISOString()
          })
        }).catch(function() {});
        
        // Track errors
        window.addEventListener('error', function(e) {
          fetch('/api/frame-telemetry', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              type: 'error',
              message: e.message,
              filename: e.filename,
              lineno: e.lineno
            })
          }).catch(function() {});
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    
    <!-- Node.js polyfills for browser compatibility -->
    <script type="module">
      import { Buffer } from 'buffer';
      import process from 'process';
      
      // Make Buffer and process globally available
      window.Buffer = Buffer;
      window.process = process;
      window.global = window;
      globalThis.Buffer = Buffer;
      globalThis.process = process;
      globalThis.global = globalThis;
    </script>
    <!-- ✅ CRITICAL: Version JavaScript to bust Warpcast cache! -->
    <script type="module" src="/src/main.tsx?v=20251120T231500"></script>
  </body>
</html>
