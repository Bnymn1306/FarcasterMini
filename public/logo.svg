<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Colorful meme tokens in a simple arrangement -->
  
  <!-- Yellow token -->
  <circle cx="16" cy="20" r="8" fill="#FFD700"/>
  <circle cx="14" cy="19" r="2" fill="#000"/>
  <circle cx="18" cy="19" r="2" fill="#000"/>
  <ellipse cx="16" cy="22" rx="3" ry="2" fill="#000"/>
  
  <!-- Blue token -->
  <circle cx="32" cy="14" r="9" fill="#4169E1"/>
  <circle cx="30" cy="13" r="2" fill="#fff"/>
  <circle cx="34" cy="13" r="2" fill="#fff"/>
  <circle cx="30" cy="13" r="1" fill="#000"/>
  <circle cx="34" cy="13" r="1" fill="#000"/>
  <circle cx="28" cy="11" r="3" fill="#4169E1"/>
  <circle cx="36" cy="11" r="3" fill="#4169E1"/>
  
  <!-- Cyan token -->
  <circle cx="48" cy="20" r="7" fill="#00CED1"/>
  <circle cx="46" cy="19" r="1.5" fill="#fff"/>
  <circle cx="50" cy="19" r="1.5" fill="#fff"/>
  <circle cx="46" cy="19" r="1" fill="#000"/>
  <circle cx="50" cy="19" r="1" fill="#000"/>
  
  <!-- Green token -->
  <circle cx="14" cy="38" r="8" fill="#32CD32"/>
  <circle cx="12" cy="37" r="2" fill="#000"/>
  <circle cx="16" cy="37" r="2" fill="#000"/>
  <path d="M 11 40 Q 14 42 17 40" stroke="#000" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  
  <!-- Purple token -->
  <circle cx="32" cy="44" r="7" fill="#9370DB"/>
  <circle cx="30" cy="43" r="1.5" fill="#000"/>
  <circle cx="34" cy="43" r="1.5" fill="#000"/>
  <circle cx="32" cy="46" r="1.5" fill="#000"/>
  
  <!-- Orange token -->
  <circle cx="50" cy="38" r="8" fill="#FF8C00"/>
  <circle cx="48" cy="37" r="2" fill="#000"/>
  <circle cx="52" cy="37" r="2" fill="#000"/>
  <ellipse cx="50" cy="40" rx="3" ry="2" fill="#000"/>
  
  <!-- Center blue token -->
  <circle cx="32" cy="32" r="7" fill="#1E90FF"/>
  <circle cx="30" cy="31" r="1.5" fill="#fff"/>
  <circle cx="34" cy="31" r="1.5" fill="#fff"/>
  <circle cx="30" cy="31" r="1" fill="#000"/>
  <circle cx="34" cy="31" r="1" fill="#000"/>
  
  <!-- "B" letter in center -->
  <text x="32" y="58" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#00d4ff" text-anchor="middle">B</text>
</svg>
