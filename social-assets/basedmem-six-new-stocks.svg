        <g transform="translate(157 25)"><rect width="144" height="48" rx="10" fill="#102c40" stroke="#1b7186"/><text x="16" y="31" fill="#d8fbfd">MSFTc</text></g>
        <g transform="translate(314 25)"><rect width="144" height="48" rx="10" fill="#102c40" stroke="#1b7186"/><text x="16" y="31" fill="#d8fbfd">MSTRc</text></g>
        <g transform="translate(0 87)"><rect width="144" height="48" rx="10" fill="#16273f" stroke="#7865b8"/><text x="16" y="31" fill="#efe9ff">SNDKc</text></g>
        <g transform="translate(157 87)"><rect width="144" height="48" rx="10" fill="#16273f" stroke="#7865b8"/><text x="16" y="31" fill="#efe9ff">SPCXc</text></g>
        <g transform="translate(314 87)"><rect width="144" height="48" rx="10" fill="#16273f" stroke="#7865b8"/><text x="16" y="31" fill="#efe9ff">TSLAc</text></g>
        <image x="656" y="266" width="800" height="500" preserveAspectRatio="xMidYMid slice" href="data:image/jpeg;base64,"/>
      </g>
    </g>
    <g transform="translate(80 733)">
      <rect width="468" height="71" rx="14" fill="#0c2535" stroke="#21dce8" stroke-opacity=".44"/>
      <path d="M25 26l9-7 9 7v11c0 9-9 13-9 13s-9-4-9-13Z" fill="none" stroke="#37e4ea" stroke-width="2.2"/><path d="m29 35 3.5 3.5 6-7" fill="none" stroke="#37e4ea" stroke-width="2.2"/>
      <text x="62" y="30" font-size="14" font-weight="700" fill="#dffcff" letter-spacing=".8">VERIFIED AERODROME SLIPSTREAM EXECUTION</text>
      <text x="62" y="52" font-size="14" fill="#8fa9bb">10 tradeable stocks total · Every transaction needs your approval</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="632" y="236" width="856" height="560" rx="26" fill="#0a1424" stroke="url(#edge)" stroke-width="2"/>
      <rect x="656" y="266" width="800" height="500" rx="16" fill="#040914"/>
      <g clip-path="url(#screen)">
        <image x="656" y="266" width="800" height="500" preserveAspectRatio="xMidYMid slice" href="data:image/jpeg;base64,"/>
      </g>
      <rect x="656" y="266" width="800" height="500" rx="16" fill="none" stroke="#91f9fb" stroke-opacity=".2"/>
      <g transform="translate(680 288)"><rect width="120" height="32" rx="16" fill="#0a1828" fill-opacity=".88" stroke="#2ce0e7" stroke-opacity=".55"/><circle cx="17" cy="16" r="4" fill="#28e1e8"/><text x="29" y="21" font-size="13" font-weight="700" fill="#dffeff" letter-spacing=".8">LIVE APP</text></g>
    </g>
    <text x="1246" y="842" font-size="16" font-weight="700" fill="#83a6bd" letter-spacing="1.8">BUILT ON BASE</text>
  </g>
</svg>