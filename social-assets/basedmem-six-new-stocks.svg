<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">BasedMem Stock Agents now support six new Coinbase Tokenized Stocks</title>
  <desc id="desc">Promotional social graphic announcing AMZNc, MSFTc, MSTRc, SNDKc, SPCXc and TSLAc as new tokenized stock options, with a BasedMem product screenshot.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111d"/><stop offset=".52" stop-color="#0b2032"/><stop offset="1" stop-color="#10152b"/></linearGradient>
    <radialGradient id="cyan" cx=".18" cy=".12" r=".72"><stop stop-color="#11cfe1" stop-opacity=".26"/><stop offset="1" stop-color="#11cfe1" stop-opacity="0"/></radialGradient>
    <radialGradient id="pink" cx=".9" cy=".85" r=".65"><stop stop-color="#dd60c8" stop-opacity=".21"/><stop offset="1" stop-color="#dd60c8" stop-opacity="0"/></radialGradient>
    <linearGradient id="edge" x1="0" x2="1"><stop stop-color="#19deea"/><stop offset=".55" stop-color="#4c8fff"/><stop offset="1" stop-color="#ee79d9"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="30" stdDeviation="28" flood-color="#020611" flood-opacity=".68"/></filter>
    <filter id="blur"><feGaussianBlur stdDeviation="30"/></filter>
    <clipPath id="screen"><rect x="656" y="266" width="800" height="500" rx="16"/></clipPath>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#7bddeb" stroke-opacity=".055"/></pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#cyan)"/><rect width="1600" height="900" fill="url(#pink)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <path d="M0 716C224 653 439 771 659 697s389-164 623-87c128 45 215 72 318 46V900H0Z" fill="#07111d" opacity=".52"/>
  <g font-family="Arial, sans-serif">
    <g transform="translate(80 65)">
      <rect width="31" height="31" rx="8" fill="url(#edge)"/>
      <path d="M10 8h8.5c4.2 0 6.6 1.8 6.6 5.3 0 2.1-1.2 3.8-3.1 4.5 2.6.7 4.1 2.5 4.1 5.1 0 3.7-2.7 5.9-7.3 5.9H10Zm6 5v3.1h2.1c1.3 0 2-.6 2-1.6s-.7-1.5-2-1.5Zm0 7.7v3.4h2.8c1.5 0 2.4-.6 2.4-1.7s-.9-1.7-2.4-1.7Z" fill="#fff"/>
      <text x="43" y="23" font-size="22" font-weight="700" fill="#f0f6ff" letter-spacing="-.6">BasedMem</text>
    </g>
    <g transform="translate(80 156)">
      <rect width="205" height="34" rx="17" fill="#0b3041" stroke="#1ce0e8" stroke-opacity=".55"/>
      <circle cx="18" cy="17" r="5" fill="#20e0e5"/><text x="33" y="22" font-size="14" font-weight="700" fill="#a7f6f5" letter-spacing="1.9">STOCK AGENTS</text>
    </g>
    <text x="80" y="265" font-size="78" font-weight="800" fill="#f5fbff" letter-spacing="-4">SIX NEW</text>
    <text x="80" y="347" font-size="78" font-weight="800" fill="#4beaf1" letter-spacing="-4">STOCKS. LIVE.</text>
    <text x="84" y="398" font-size="21" fill="#b4c5d7" letter-spacing=".1">Coinbase Tokenized Stocks are now available in your</text>
    <text x="84" y="427" font-size="21" fill="#b4c5d7" letter-spacing=".1">human-controlled onchain trading workspace on Base.</text>
    <g transform="translate(80 475)">
      <text y="0" font-size="15" font-weight="700" fill="#86a2b9" letter-spacing="2">NEWLY SUPPORTED</text>
      <g font-family="monospace" font-size="24" font-weight="700">
